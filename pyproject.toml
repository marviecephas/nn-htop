[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nn-htop"
version = "0.1.1"
description = "htop for Neural Networks: A terminal UI monitoring PyTorch layers, activations, and gradients in real-time."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "marviecephas", email = "marviecephas@gmail.com" }
]
keywords = ["pytorch", "deep-learning", "tui", "monitoring", "terminal", "mlops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.0.0",
    "textual>=0.50.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
nn-htop = "nn_htop.harness:main"

[tool.hatch.build.targets.wheel]
packages = ["nn_htop"]
